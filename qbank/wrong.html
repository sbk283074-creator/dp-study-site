<!DOCTYPE html>
<html lang="en" data-subject="qbank">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wrong Book — Question Bank</title>
<link rel="stylesheet" href="../assets/css/main.css">
<link rel="stylesheet" href="../assets/css/qbank.css">
</head>
<body>
<div id="app-shell">

  <span class="eyebrow">Question Bank · Wrong book</span>
  <h1 class="page-title">Your wrong book</h1>
  <p class="lede">Every question you mark wrong in practice lands here. Review them spaced out — the act of retrieving
  the answer from memory is what makes it stick. Mark a question as learned to remove it.</p>

  <div id="qb-root">
    <div class="qb-toolbar__row" style="margin-bottom:14px">
      <span class="qb-count" id="qb-count"></span>
      <span style="flex:1"></span>
      <button class="btn" id="qb-clear" type="button">Clear all</button>
    </div>
    <div id="qb-results"></div>
  </div>

</div>

<script src="data/physics.js"></script>
<script src="data/mathematics.js"></script>
<script src="data/computer-science.js"></script>
<script src="../assets/js/app.js"></script>
<script src="qbank.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  const $ = function (id) { return document.getElementById(id); };
  const byId = {}; QB.data().forEach(function (r) { byId[r.id] = r; });
  const results = $("qb-results");

  function list() { return QB.getWrong().map(function (id) { return byId[id]; }).filter(Boolean); }

  function render() {
    const items = list();
    $("qb-count").innerHTML = "<b>" + items.length + "</b> question" + (items.length === 1 ? "" : "s") + " to revisit";
    if (!items.length) {
      results.innerHTML = '<div class="qb-empty">Your wrong book is empty. Mark questions wrong in <a href="practice.html">practice</a> and they will appear here.</div>';
      return;
    }
    results.innerHTML = '<div class="qb-grid">' + items.map(function (r) {
      return QB.cardHTML(r, {
        actions: '<button class="btn qb-reveal" type="button">Show answer</button>' +
                 '<button class="btn qb-learn" type="button" data-id="' + QB.esc(r.id) + '">Mark as learned</button>'
      });
    }).join("") + "</div>";
    results.querySelectorAll(".qb-learn").forEach(function (b) {
      b.addEventListener("click", function () {
        QB.removeWrong(b.getAttribute("data-id"));
        render();
      });
    });
  }

  $("qb-clear").addEventListener("click", function () {
    if (!QB.getWrong().length) return;
    if (window.confirm("Remove all questions from your wrong book?")) { QB.storeSet("wrong", []); render(); }
  });

  render();
});
</script>
</body>
</html>
