<!DOCTYPE html>
<html lang="en" data-subject="qbank">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knowledge Points — Question Bank</title>
<link rel="stylesheet" href="../assets/css/main.css">
<link rel="stylesheet" href="../assets/css/qbank.css">
</head>
<body>
<div id="app-shell">

  <span class="eyebrow">Question Bank · By knowledge point</span>
  <h1 class="page-title">Knowledge points</h1>
  <p class="lede">Browse the syllabus broken down by knowledge point, then open every question tagged to one. Tap a
  row to see its questions.</p>

  <div id="qb-root">
    <div class="qb-list" id="qb-kp"></div>
    <div id="qb-results" style="margin-top:18px"></div>
    <div style="margin-top:14px"><button class="btn" id="qb-back" type="button" hidden>← Back to all knowledge points</button></div>
  </div>

</div>

<script src="data/physics.js"></script>
<script src="data/mathematics.js"></script>
<script src="data/computer-science.js"></script>
<script src="qbnav.js"></script>
<script src="qbank.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  const $ = function (id) { return document.getElementById(id); };
  const recs = QB.data();

  // Build the knowledge-point list (use curated meta if exported, else derive).
  let kps = QB.knowledgePoints();
  if (!kps.length) {
    const m = {}; const grp = {};
    recs.forEach(function (r) { (r.kps || []).forEach(function (k) { m[k] = (m[k] || 0) + 1; if (!grp[k]) grp[k] = r.group; }); });
    kps = Object.keys(m).sort(function (a, b) { return m[b] - m[a]; }).map(function (k) {
      return { id: k, title: k, description: "", count: m[k], group: grp[k] };
    });
  }

  const kpRoot = $("qb-kp"), results = $("qb-results");
  function renderList() {
    $("qb-back").hidden = true;
    results.innerHTML = "";
    if (!kps.length) { kpRoot.innerHTML = '<div class="qb-empty">No knowledge points are tagged in this export.</div>'; return; }
    kpRoot.innerHTML = kps.map(function (k) {
      const sub = [k.code ? "code " + k.code : "", k.group ? QB.groups().filter(function (g) { return g.v === k.group; })[0] || k.group : "", k.count + " Qs"].filter(Boolean).join(" · ");
      return '<a class="qb-row" href="#" data-id="' + QB.esc(k.id) + '">' +
        '<div class="qb-row__main"><div class="qb-row__title">' + QB.esc(k.title || k.id) + "</div>" +
        '<div class="qb-row__sub">' + QB.esc(sub) + (k.description ? " — " + QB.esc(k.description) : "") + "</div></div>" +
        '<span class="qb-row__n">' + k.count + "</span><span class=\"qb-row__chev\">›</span></a>";
    }).join("");
    kpRoot.querySelectorAll(".qb-row").forEach(function (a) {
      a.addEventListener("click", function (e) { e.preventDefault(); showKP(a.getAttribute("data-id")); });
    });
  }

  function showKP(id) {
    const items = recs.filter(function (r) { return (r.kps || []).indexOf(id) >= 0; });
    $("qb-back").hidden = false;
    kpRoot.innerHTML = "";
    results.innerHTML = "<h3>" + items.length + " question" + (items.length === 1 ? "" : "s") + " on this knowledge point</h3>";
    QB.renderPaged(items, results, {});
  }

  $("qb-back").addEventListener("click", renderList);
  renderList();
});
</script>
</body>
</html>
