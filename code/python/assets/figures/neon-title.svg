<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" role="img" aria-label="Neon Dungeon title screen: glowing cyan title, a four item menu with New Run selected, and a best floor badge">
  <defs>
    <radialGradient id="neonTitle-vignette" cx="50%" cy="44%" r="70%">
      <stop offset="0%" stop-color="#1b2231" stop-opacity="0.75"/>
      <stop offset="60%" stop-color="#101520" stop-opacity="0.60"/>
      <stop offset="100%" stop-color="#0b0d12" stop-opacity="0.95"/>
    </radialGradient>
    <radialGradient id="neonTitle-torch" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb347" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <pattern id="neonTitle-tiles" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#171b24"/>
      <path d="M40 0 L40 40 L0 40" fill="none" stroke="#232833" stroke-width="1"/>
    </pattern>
    <filter id="neonTitle-glowL" x="-25%" y="-80%" width="150%" height="260%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="neonTitle-glowS" x="-40%" y="-200%" width="180%" height="500%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="880" height="520" fill="#0f1115" rx="10"/>

  <g font-family="ui-monospace, Menlo, Consolas, monospace">
    <!-- dungeon suggested behind the title -->
    <rect x="40" y="40" width="800" height="440" fill="url(#neonTitle-tiles)" opacity="0.30"/>
    <g opacity="0.45">
      <rect x="70" y="96" width="250" height="26" fill="#2b3242"/>
      <rect x="70" y="96" width="250" height="6" fill="#3d465a"/>
      <rect x="560" y="96" width="250" height="26" fill="#2b3242"/>
      <rect x="560" y="96" width="250" height="6" fill="#3d465a"/>
      <rect x="560" y="340" width="250" height="26" fill="#2b3242"/>
      <rect x="560" y="340" width="250" height="6" fill="#3d465a"/>
      <rect x="70" y="430" width="180" height="26" fill="#2b3242"/>
      <rect x="70" y="430" width="180" height="6" fill="#3d465a"/>
    </g>
    <circle cx="690" cy="112" r="86" fill="url(#neonTitle-torch)"/>
    <rect width="880" height="520" fill="url(#neonTitle-vignette)"/>
    <rect x="12" y="12" width="856" height="496" rx="8" fill="none" stroke="#232833" stroke-width="1.5"/>

    <!-- title -->
    <text x="440" y="196" text-anchor="middle" font-size="52" font-weight="bold" fill="#34e0d8" letter-spacing="3" opacity="0.85" filter="url(#neonTitle-glowL)">NEON DUNGEON</text>
    <text x="440" y="196" text-anchor="middle" font-size="52" font-weight="bold" fill="#34e0d8" letter-spacing="3">NEON DUNGEON</text>

    <!-- magenta underline accent -->
    <rect x="290" y="212" width="300" height="3" rx="1.5" fill="#ff4fd8" opacity="0.7" filter="url(#neonTitle-glowS)"/>
    <rect x="290" y="212" width="300" height="3" rx="1.5" fill="#ff4fd8"/>
    <circle cx="272" cy="213.5" r="2.5" fill="#ff4fd8"/>
    <circle cx="608" cy="213.5" r="2.5" fill="#ff4fd8"/>

    <text x="440" y="246" text-anchor="middle" font-size="14" fill="#7c8699">a roguelike in 800 lines</text>

    <!-- menu -->
    <rect x="290" y="278" width="300" height="34" rx="7" fill="#34e0d8" fill-opacity="0.08" stroke="#34e0d8" stroke-width="1.5" opacity="0.75" filter="url(#neonTitle-glowS)"/>
    <rect x="290" y="278" width="300" height="34" rx="7" fill="#34e0d8" fill-opacity="0.07" stroke="#34e0d8" stroke-width="1.5"/>
    <text x="312" y="301" font-size="17" font-weight="bold" fill="#34e0d8">&gt;</text>
    <text x="338" y="301" font-size="19" font-weight="bold" fill="#34e0d8">New Run</text>
    <text x="338" y="338" font-size="16" fill="#7c8699">Continue — Floor 3</text>
    <text x="338" y="370" font-size="16" fill="#7c8699">Settings</text>
    <text x="338" y="402" font-size="16" fill="#7c8699">Quit</text>

    <!-- badges -->
    <rect x="28" y="474" width="160" height="28" rx="7" fill="#171b24" stroke="#3d465a" stroke-width="1"/>
    <text x="108" y="492" text-anchor="middle" font-size="13" fill="#ffb347">Best: Floor 7</text>
    <text x="852" y="492" text-anchor="end" font-size="12" fill="#7c8699">v1.0 · arrow keys to move</text>
  </g>
</svg>
