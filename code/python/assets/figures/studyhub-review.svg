  <rect x="32" y="408" width="168" height="68" rx="8" fill="#ffffff" stroke="#e3e6ea"/>
  <rect x="44" y="422" width="3" height="40" rx="1.5" fill="#2f6df6"/>
  <text x="58" y="438" font-size="11.5" fill="#8b9099">Due today</text>
  <text x="58" y="464" font-size="22" font-weight="700" fill="#16181d">18</text>

  <text x="240" y="54" font-size="16" font-weight="600" fill="#16181d">Spanish A1 — core verbs</text>
  <rect x="722" y="34" width="118" height="28" rx="14" fill="#fdf1de"/>
  <text x="781" y="52" font-size="12.5" font-weight="600" fill="#b37400" text-anchor="middle">12 day streak</text>

  <rect x="240" y="74" width="600" height="8" rx="4" fill="#eef0f3"/>
  <rect x="240" y="74" width="183" height="8" rx="4" fill="#2f6df6"/>
