  <rect x="240" y="122" width="600" height="224" rx="10" fill="#ffffff" stroke="#e3e6ea"/>
  <text x="540" y="192" font-size="20" fill="#16181d" text-anchor="middle">the verb 'to run' — Spanish</text>
  <line x1="272" y1="234" x2="808" y2="234" stroke="#e3e6ea"/>
  <text x="540" y="286" font-size="20" font-weight="700" fill="#16181d" text-anchor="middle">correr</text>

  <rect x="240" y="372" width="141" height="56" rx="8" fill="#fdecea" stroke="#f3cfcb"/>
  <text x="310" y="398" font-size="14.5" font-weight="600" fill="#c0453c" text-anchor="middle">Again</text>
  <text x="310" y="418" font-size="12" fill="#55595f" text-anchor="middle">1m</text>

  <rect x="393" y="372" width="141" height="56" rx="8" fill="#fdf1de" stroke="#f0dcb8"/>
  <text x="463" y="398" font-size="14.5" font-weight="600" fill="#b37400" text-anchor="middle">Hard</text>
  <text x="463" y="418" font-size="12" fill="#55595f" text-anchor="middle">10m</text>

  <rect x="546" y="372" width="141" height="56" rx="8" fill="#eaf0ff" stroke="#cddcfb"/>
