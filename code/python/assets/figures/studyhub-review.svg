<line x1="216" y1="16" x2="216" y2="504" stroke="#e3e6ea"/>

<g font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <rect x="40" y="40" width="24" height="24" rx="6" fill="#2f6df6"/>
  <text x="52" y="57" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">S</text>
  <text x="74" y="57" font-size="16" font-weight="700" fill="#16181d">StudyHub</text>

  <rect x="32" y="100" width="168" height="36" rx="6" fill="#eaf0ff"/>
