<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" role="img" aria-label="StudyHub review screen showing a flashcard with the revealed answer, progress bar, four grade buttons and a streak badge">
<rect width="880" height="520" fill="#0f1115" rx="10"/>
<rect x="16" y="16" width="848" height="488" rx="8" fill="#ffffff" stroke="#e3e6ea"/>
