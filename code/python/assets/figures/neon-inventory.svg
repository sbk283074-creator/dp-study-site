<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" role="img" aria-label="Neon Dungeon level up and inventory screen: item grid on the left, Pulse Blade details on the right, and two bonus cards at the top">
  <defs>
    <filter id="neonInv-blur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="neonInv-glowS" x="-40%" y="-120%" width="180%" height="340%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="880" height="520" fill="#0f1115" rx="10"/>

  <!-- dimmed, blurred dungeon behind the overlay -->
  <g filter="url(#neonInv-blur)">
    <rect width="880" height="520" fill="#171b24"/>
    <rect x="40" y="90" width="330" height="230" fill="#1b2029"/>
    <rect x="380" y="70" width="440" height="300" fill="#1b2029"/>
    <rect x="40" y="70" width="360" height="24" fill="#2b3242"/>
    <rect x="660" y="330" width="180" height="26" fill="#2b3242"/>
    <rect x="40" y="330" width="300" height="24" fill="#2b3242"/>
    <circle cx="250" cy="300" r="70" fill="#34e0d8" opacity="0.35"/>
    <circle cx="600" cy="220" r="60" fill="#ff4fd8" opacity="0.28"/>
    <circle cx="470" cy="420" r="80" fill="#34e0d8" opacity="0.18"/>
  </g>
  <rect width="880" height="520" fill="#000000" fill-opacity="0.72"/>

  <g font-family="ui-monospace, Menlo, Consolas, monospace">
    <rect x="12" y="12" width="856" height="496" rx="8" fill="none" stroke="#232833" stroke-width="1.5"/>

    <!-- ============ header + bonus cards ============ -->
    <text x="440" y="44" text-anchor="middle" font-size="18" font-weight="bold" fill="#34e0d8" letter-spacing="2">LEVEL UP · Choose a bonus</text>

    <rect x="198" y="62" width="230" height="52" rx="7" fill="#12151d" stroke="#34e0d8" stroke-width="1.5" opacity="0.7" filter="url(#neonInv-glowS)"/>
    <rect x="198" y="62" width="230" height="52" rx="7" fill="#12151d" stroke="#34e0d8" stroke-width="1.5"/>
    <text x="214" y="84" font-size="15" font-weight="bold" fill="#34e0d8">Overclock</text>
    <text x="214" y="103" font-size="12" fill="#7c8699">+25% attack speed</text>

    <rect x="452" y="62" width="230" height="52" rx="7" fill="#12151d" stroke="#232833" stroke-width="1.5"/>
    <text x="468" y="84" font-size="15" fill="#7c8699">Lifesteal</text>
    <text x="468" y="103" font-size="12" fill="#7c8699">Heal 2 HP on kill</text>

    <!-- ============ left panel: inventory ============ -->
    <rect x="40" y="130" width="332" height="300" rx="8" fill="#12151d" stroke="#3d465a" stroke-width="1"/>
    <text x="60" y="160" font-size="14" fill="#e8ecf4" letter-spacing="2">INVENTORY</text>
    <text x="352" y="160" text-anchor="end" font-size="12" fill="#7c8699">8 / 12</text>

    <rect x="60" y="182" width="64" height="64" rx="8" fill="#12151d" stroke="#232833" stroke-width="1"/>
    <rect x="136" y="182" width="64" height="64" rx="8" fill="#12151d" stroke="#232833" stroke-width="1"/>
    <rect x="212" y="182" width="64" height="64" rx="8" fill="#12151d" stroke="#232833" stroke-width="1"/>
    <rect x="288" y="182" width="64" height="64" rx="8" fill="#12151d" stroke="#232833" stroke-width="1"/>
    <rect x="60" y="258" width="64" height="64" rx="8" fill="#12151d" stroke="#232833" stroke-width="1"/>
    <rect x="136" y="258" width="64" height="64" rx="8" fill="#12151d" stroke="#232833" stroke-width="1"/>
    <rect x="212" y="258" width="64" height="64" rx="8" fill="#12151d" stroke="#232833" stroke-width="1"/>
    <rect x="288" y="258" width="64" height="64" rx="8" fill="#12151d" stroke="#232833" stroke-width="1"/>
    <rect x="60" y="334" width="64" height="64" rx="8" fill="#12151d" stroke="#232833" stroke-width="1"/>
    <rect x="136" y="334" width="64" height="64" rx="8" fill="#12151d" stroke="#232833" stroke-width="1"/>
    <rect x="212" y="334" width="64" height="64" rx="8" fill="#12151d" stroke="#232833" stroke-width="1"/>
    <rect x="288" y="334" width="64" height="64" rx="8" fill="#12151d" stroke="#232833" stroke-width="1"/>

    <!-- rare (magenta) selected slot -->
    <rect x="60" y="182" width="64" height="64" rx="8" fill="none" stroke="#ff4fd8" stroke-width="1.5"/>
    <rect x="56" y="178" width="72" height="72" rx="11" fill="none" stroke="#b6ff5c" stroke-width="1.5" stroke-opacity="0.9"/>
    <!-- legendary (amber) slot -->
    <rect x="212" y="258" width="64" height="64" rx="8" fill="none" stroke="#ffb347" stroke-width="1.5"/>

    <!-- glyphs -->
    <g transform="translate(92,214)">
      <polygon points="0,-19 5,-11 5,7 -5,7 -5,-11" fill="#34e0d8"/>
      <rect x="-9" y="7" width="18" height="4" rx="1" fill="#e8ecf4"/>
      <rect x="-3" y="11" width="6" height="9" rx="1" fill="#ffb347"/>
    </g>
    <g transform="translate(168,214)">
      <rect x="-3" y="-18" width="6" height="8" fill="#7c8699"/>
      <path d="M-12 -10 L12 -10 L12 -6 Q14 4 8 15 L-8 15 Q-14 4 -12 -6 Z" fill="#ff4fd8" fill-opacity="0.85"/>
    </g>
    <g transform="translate(244,214)">
      <circle cx="0" cy="2" r="12" fill="none" stroke="#ffb347" stroke-width="4"/>
      <polygon points="0,-19 5,-13 0,-7 -5,-13" fill="#34e0d8"/>
    </g>
    <g transform="translate(92,290)">
      <polygon points="0,-18 15,-11 15,3 0,19 -15,3 -15,-11" fill="#b6ff5c" fill-opacity="0.18" stroke="#b6ff5c" stroke-width="2"/>
      <rect x="-2" y="-8" width="4" height="16" rx="1" fill="#b6ff5c"/>
    </g>
    <g transform="translate(168,290)">
      <rect x="-13" y="-16" width="26" height="32" rx="2" fill="#232833" stroke="#e8ecf4" stroke-width="1.5"/>
      <rect x="-7" y="-9" width="14" height="2" fill="#7c8699"/>
      <rect x="-7" y="-3" width="14" height="2" fill="#7c8699"/>
      <rect x="-7" y="3" width="9" height="2" fill="#7c8699"/>
    </g>
    <g transform="translate(244,290)">
      <polygon points="0,-17 14,-6 0,17 -14,-6" fill="#ffb347" fill-opacity="0.85"/>
      <polygon points="0,-17 5,-6 0,0 -5,-6" fill="#ffe2b0" fill-opacity="0.7"/>
    </g>
    <g transform="translate(92,366) scale(0.78)">
      <polygon points="0,-19 5,-11 5,7 -5,7 -5,-11" fill="#ff4fd8"/>
      <rect x="-9" y="7" width="18" height="4" rx="1" fill="#e8ecf4"/>
      <rect x="-3" y="11" width="6" height="9" rx="1" fill="#7c8699"/>
    </g>
    <g transform="translate(168,366)">
      <rect x="-3" y="-18" width="6" height="8" fill="#7c8699"/>
      <path d="M-12 -10 L12 -10 L12 -6 Q14 4 8 15 L-8 15 Q-14 4 -12 -6 Z" fill="#232833" stroke="#b6ff5c" stroke-width="1.5"/>
      <path d="M-11 -1 L11 -1 L8 13 L-8 13 Z" fill="#b6ff5c" fill-opacity="0.75"/>
    </g>

    <text x="60" y="418" font-size="12" fill="#7c8699">8 of 12 slots filled</text>

    <!-- ============ right panel: item detail ============ -->
    <rect x="392" y="130" width="448" height="300" rx="8" fill="#12151d" stroke="#3d465a" stroke-width="1"/>
    <text x="416" y="182" font-size="26" font-weight="bold" fill="#34e0d8">Pulse Blade</text>
    <text x="416" y="206" font-size="13" fill="#ff4fd8" letter-spacing="3">RARE</text>
    <line x1="416" y1="222" x2="816" y2="222" stroke="#232833" stroke-width="1"/>

    <text x="416" y="256" font-size="14" fill="#e8ecf4">+12 ATK</text>
    <rect x="500" y="247" width="260" height="9" rx="4.5" fill="#171b24" stroke="#3d465a" stroke-width="1"/>
    <rect x="501" y="248" width="182" height="7" rx="3.5" fill="#34e0d8"/>

    <text x="416" y="288" font-size="14" fill="#e8ecf4">+3 Crit</text>
    <rect x="500" y="279" width="260" height="9" rx="4.5" fill="#171b24" stroke="#3d465a" stroke-width="1"/>
    <rect x="501" y="280" width="91" height="7" rx="3.5" fill="#ff4fd8"/>

    <text x="416" y="320" font-size="14" fill="#e8ecf4">-1 SPD</text>
    <rect x="500" y="311" width="260" height="9" rx="4.5" fill="#171b24" stroke="#3d465a" stroke-width="1"/>
    <rect x="501" y="312" width="78" height="7" rx="3.5" fill="#ff4d5e"/>

    <line x1="416" y1="344" x2="816" y2="344" stroke="#232833" stroke-width="1"/>
    <text x="416" y="370" font-size="13" fill="#7c8699">A stolen prototype. It hums when it</text>
    <text x="416" y="390" font-size="13" fill="#7c8699">cuts, and it never stops humming.</text>
    <text x="416" y="418" font-size="14" fill="#ffb347">Scrap: 184</text>

    <text x="440" y="468" text-anchor="middle" font-size="13" fill="#7c8699">ARROWS select · ENTER equip · ESC close</text>
  </g>
</svg>
