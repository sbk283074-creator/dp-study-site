<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" role="img" aria-label="StudyHub login screen with a centred card containing the tagline, email and password fields, a sign in button, a forgot password link and a create account button">
<rect width="880" height="520" fill="#0f1115" rx="10"/>
<rect x="16" y="16" width="848" height="488" rx="8" fill="#ffffff" stroke="#e3e6ea"/>

<g font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <rect x="381" y="36" width="24" height="24" rx="6" fill="#2f6df6"/>
  <text x="393" y="53" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">S</text>
  <text x="415" y="54" font-size="18" font-weight="700" fill="#16181d">StudyHub</text>

  <rect x="260" y="88" width="360" height="376" rx="12" fill="#ffffff" stroke="#e3e6ea"/>

  <text x="440" y="130" font-size="13.5" fill="#55595f" text-anchor="middle">Spaced repetition that sticks</text>

  <text x="288" y="164" font-size="12" font-weight="600" fill="#55595f">Email</text>
  <rect x="288" y="172" width="304" height="38" rx="6" fill="#ffffff" stroke="#e3e6ea"/>
  <text x="302" y="196" font-size="13.5" fill="#8b9099">you@example.com</text>

  <text x="288" y="240" font-size="12" font-weight="600" fill="#55595f">Password</text>
  <rect x="288" y="248" width="304" height="38" rx="6" fill="#ffffff" stroke="#e3e6ea"/>
  <text x="302" y="272" font-size="13.5" fill="#8b9099">••••••••</text>

  <rect x="288" y="302" width="304" height="42" rx="6" fill="#2f6df6"/>
  <text x="440" y="328" font-size="14.5" font-weight="600" fill="#ffffff" text-anchor="middle">Sign in</text>

  <text x="440" y="362" font-size="12.5" fill="#8b9099" text-anchor="middle">Forgot password?</text>
  <line x1="392" y1="366" x2="488" y2="366" stroke="#d6dae0"/>

  <line x1="288" y1="384" x2="592" y2="384" stroke="#e3e6ea"/>

  <rect x="288" y="400" width="304" height="42" rx="6" fill="#ffffff" stroke="#dfe3e8"/>
  <text x="440" y="426" font-size="14" font-weight="600" fill="#16181d" text-anchor="middle">Create an account</text>
</g>
</svg>
