<figure class="fig">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 230" role="img" aria-label="A right-angled isosceles glass prism. A ray enters normally through the upper face, so it is not bent, and meets the hypotenuse at 45 degrees to the normal. It is drawn totally internally reflected and leaves through the left face.">
<defs><marker id="q11-ar" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#14181f"/></marker></defs>
<polygon points="80,40 240,40 80,200" fill="#e6eaf2" stroke="#14181f" stroke-width="2" stroke-linejoin="round"/>
<line x1="160" y1="12" x2="160" y2="120" stroke="#b3352f" stroke-width="2.2" marker-end="url(#q11-ar)"/>
<line x1="140" y1="100" x2="180" y2="140" stroke="#7b8494" stroke-width="1.4" stroke-dasharray="5 4"/>
<line x1="160" y1="120" x2="80" y2="120" stroke="#2f5fd0" stroke-width="2.2"/>
<line x1="80" y1="120" x2="34" y2="120" stroke="#2f5fd0" stroke-width="2.2" marker-end="url(#q11-ar)"/>
<polyline points="160,100 159.019,100.024 158.04,100.096 157.065,100.216 156.098,100.384 155.14,100.599 154.194,100.861 153.262,101.169 152.346,101.522 151.449,101.92 150.572,102.362 149.718,102.845 148.889,103.371 148.086,103.936 147.312,104.54 146.569,105.181 145.858,105.858" fill="none" stroke="#b3352f" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="145" y="92" font-size="11.5" text-anchor="middle" fill="#b3352f">45°</text>
<text x="150" y="62" font-size="11" text-anchor="end" fill="#b3352f">incident</text>
<text x="86" y="108" font-size="11" fill="#2f5fd0">reflected</text>
<text x="100" y="82" font-size="11" fill="#7b8494">glass</text>
<text x="200" y="24" font-size="11" fill="#7b8494">air</text>
<text x="160" y="220" font-size="11" text-anchor="middle" fill="#7b8494">the long face is the hypotenuse</text>
</svg>
