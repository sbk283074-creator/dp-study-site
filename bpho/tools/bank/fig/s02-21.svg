<figure class="fig">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 268" role="img" aria-label="Four nuclear energy levels at 0, 1.0, 3.0 and 7.0 MeV above the ground state, with one downward transition arrow drawn as an example">
<defs><marker id="s02-21-ar" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#14181f"/></marker></defs>
<line x1="96" y1="224" x2="264" y2="224" stroke="#14181f" stroke-width="2"/>
<text x="274" y="228" font-size="11.5" fill="#14181f">0</text>
<line x1="96" y1="202" x2="264" y2="202" stroke="#14181f" stroke-width="2"/>
<text x="274" y="206" font-size="11.5" fill="#14181f">1.0</text>
<line x1="96" y1="158" x2="264" y2="158" stroke="#14181f" stroke-width="2"/>
<text x="274" y="162" font-size="11.5" fill="#14181f">3.0</text>
<line x1="96" y1="70" x2="264" y2="70" stroke="#14181f" stroke-width="2"/>
<text x="274" y="74" font-size="11.5" fill="#14181f">7.0</text>
<line x1="150" y1="72" x2="150" y2="222" stroke="#2f5fd0" stroke-width="1.8" marker-end="url(#s02-21-ar)"/>
<text x="160" y="180" font-size="10.5" fill="#2f5fd0">one possible</text>
<text x="160" y="194" font-size="10.5" fill="#2f5fd0">transition</text>
<text x="88" y="30" font-size="11" fill="#7b8494">energy above the ground state</text>
<text x="274" y="246" font-size="11" fill="#7b8494">MeV</text>
</svg>
</figure>
