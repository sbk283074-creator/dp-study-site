<figure class="fig">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 190" role="img" aria-label="A uniform wire of resistance R, length L and cross-sectional area A is stretched so that its length becomes L times one plus x. Its volume is unchanged, so its cross-sectional area falls in the same proportion.">
<defs><marker id="q15-ar" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#14181f"/></marker></defs>
<rect x="60" y="44" width="90" height="26" fill="#dfe8f6" stroke="#14181f" stroke-width="1.8"/>
<text x="105" y="32" font-size="11" text-anchor="middle" fill="#14181f">before: R, length L, area A</text>
<line x1="152" y1="57" x2="196" y2="57" stroke="#a8641a" stroke-width="2.4" marker-end="url(#q15-ar)"/>
<text x="174" y="44" font-size="11" text-anchor="middle" fill="#a8641a">stretch</text>
<rect x="60" y="104" width="150" height="15" fill="#dfe8f6" stroke="#14181f" stroke-width="1.8"/>
<text x="135" y="140" font-size="11" text-anchor="middle" fill="#14181f">after: length L(1 + x), area A / (1 + x)</text>
<text x="300" y="70" font-size="11" text-anchor="middle" fill="#7b8494">volume</text>
<text x="300" y="86" font-size="11" text-anchor="middle" fill="#7b8494">unchanged</text>
<path d="M262,104 L262,70" fill="none" stroke="#7b8494" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M262,70 L262,60" fill="none" stroke="#7b8494" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="200" y="172" font-size="11" text-anchor="middle" fill="#7b8494">the wire gets longer AND thinner, and both raise the resistance</text>
</svg>
</figure>
