<figure class="fig">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 200" role="img" aria-label="A pipe closed at its left end and open at its right. The curve shows the fundamental standing wave: the air cannot move at the closed end, so there is a node there, and it moves most at the open end, so there is an antinode there.">
<defs><marker id="q10-ar" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#14181f"/></marker></defs>
<line x1="50" y1="70" x2="330" y2="70" stroke="#14181f" stroke-width="2"/>
<line x1="50" y1="130" x2="330" y2="130" stroke="#14181f" stroke-width="2"/>
<line x1="50" y1="60" x2="50" y2="140" stroke="#14181f" stroke-width="4"/>
<text x="50" y="50" font-size="11.5" text-anchor="middle" fill="#14181f">closed end</text>
<text x="330" y="50" font-size="11.5" text-anchor="middle" fill="#14181f">open end</text>
<path d="M50,100 Q200,100 330,72" fill="none" stroke="#2f5fd0" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="52" y="156" font-size="11.5" text-anchor="middle" fill="#2f5fd0">node</text>
<text x="330" y="156" font-size="11.5" text-anchor="middle" fill="#2f5fd0">antinode</text>
<line x1="50" y1="140" x2="50" y2="148" stroke="#7b8494" stroke-width="1.2"/>
<line x1="330" y1="140" x2="330" y2="148" stroke="#7b8494" stroke-width="1.2"/>
<text x="190" y="186" font-size="11" text-anchor="middle" fill="#7b8494">the fundamental: a quarter of a wavelength fits</text>
</svg>
</figure>
