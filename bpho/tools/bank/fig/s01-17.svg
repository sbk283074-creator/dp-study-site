<figure class="fig">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 230" role="img" aria-label="A block of mass 5.0 kilograms on a rough plane inclined at an angle with sine 0.60 and cosine 0.80, so the plane rises 3 units for every 4 along its base. A string runs up the slope over a smooth pulley at the top and hangs vertically with a mass m on its end. An arrow shows friction acting down the slope, opposing the impending motion up the slope.">
<defs><marker id="q17-ar" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#14181f"/></marker></defs>
<polygon points="40,190 240,190 240,40" fill="#eef2f8" stroke="#14181f" stroke-width="2" stroke-linejoin="round"/>
<line x1="40" y1="190" x2="50" y2="198" stroke="#7b8494" stroke-width="1.1"/>
<line x1="65" y1="190" x2="75" y2="198" stroke="#7b8494" stroke-width="1.1"/>
<line x1="90" y1="190" x2="100" y2="198" stroke="#7b8494" stroke-width="1.1"/>
<line x1="115" y1="190" x2="125" y2="198" stroke="#7b8494" stroke-width="1.1"/>
<line x1="140" y1="190" x2="150" y2="198" stroke="#7b8494" stroke-width="1.1"/>
<line x1="165" y1="190" x2="175" y2="198" stroke="#7b8494" stroke-width="1.1"/>
<line x1="190" y1="190" x2="200" y2="198" stroke="#7b8494" stroke-width="1.1"/>
<line x1="215" y1="190" x2="225" y2="198" stroke="#7b8494" stroke-width="1.1"/>
<line x1="240" y1="190" x2="250" y2="198" stroke="#7b8494" stroke-width="1.1"/>
<polygon points="111.6,136.3 148.4,108.7 130.4,84.7 93.6,112.3" fill="#e6eaf2" stroke="#14181f" stroke-width="1.8" stroke-linejoin="round"/>
<text x="96" y="78" font-size="11.5" text-anchor="middle" fill="#14181f">5.0 kg</text>
<circle cx="252" cy="36" r="9" fill="none" stroke="#14181f" stroke-width="2"/>
<text x="252" y="16" font-size="11" text-anchor="middle" fill="#7b8494">smooth pulley</text>
<line x1="148.4" y1="108.7" x2="247" y2="40" stroke="#a8641a" stroke-width="1.8"/>
<line x1="261" y1="42" x2="261" y2="148" stroke="#a8641a" stroke-width="1.8"/>
<rect x="245" y="148" width="32" height="34" fill="#e6eaf2" stroke="#14181f" stroke-width="1.8"/>
<text x="261" y="170" font-size="12.5" text-anchor="middle" fill="#14181f">m</text>
<text x="286" y="150" font-size="11" fill="#7b8494">hangs</text>
<text x="286" y="164" font-size="11" fill="#7b8494">freely</text>
<line x1="111.6" y1="136.3" x2="83.6" y2="157.3" stroke="#b3352f" stroke-width="2.2" marker-end="url(#q17-ar)"/>
<text x="120" y="166" font-size="11" text-anchor="middle" fill="#b3352f">friction</text>
<text x="196" y="172" font-size="11" text-anchor="middle" fill="#7b8494">sin θ = 0.60</text>
<text x="196" y="186" font-size="11" text-anchor="middle" fill="#7b8494">cos θ = 0.80</text>
<text x="190" y="116" font-size="11.5" text-anchor="middle" fill="#7b8494">μ = 0.50</text>
</svg>
