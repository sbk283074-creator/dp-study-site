<figure class="fig">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 190" role="img" aria-label="A nucleus of mass number A at rest decays by emitting an alpha particle of mass number 4. The alpha particle and the recoiling nucleus of mass number A minus 4 separate with equal and opposite momenta.">
<defs><marker id="q14-ar" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#14181f"/></marker></defs>
<circle cx="80" cy="80" r="18" fill="#ece7f8" stroke="#5b3fa8" stroke-width="2.2"/>
<text x="80" y="85" font-size="13" text-anchor="middle" fill="#5b3fa8">A</text>
<text x="80" y="46" font-size="11" text-anchor="middle" fill="#7b8494">at rest</text>
<path d="M108,80 L196,80" fill="none" stroke="#7b8494" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#q14-ar)"/>
<text x="152" y="70" font-size="11" text-anchor="middle" fill="#7b8494">decays</text>
<circle cx="240" cy="56" r="11" fill="#fbeceb" stroke="#b3352f" stroke-width="2"/>
<text x="240" y="60" font-size="12.5" text-anchor="middle" fill="#b3352f">α</text>
<text x="240" y="30" font-size="11" text-anchor="middle" fill="#b3352f">mass 4</text>
<line x1="258" y1="56" x2="316" y2="56" stroke="#b3352f" stroke-width="2.2" marker-end="url(#q14-ar)"/>
<circle cx="240" cy="118" r="17" fill="#e9f5f0" stroke="#1f7a53" stroke-width="2"/>
<text x="240" y="123" font-size="11.5" text-anchor="middle" fill="#1f7a53">A−4</text>
<text x="240" y="152" font-size="11" text-anchor="middle" fill="#1f7a53">mass A − 4</text>
<line x1="216" y1="118" x2="158" y2="118" stroke="#1f7a53" stroke-width="2.2" marker-end="url(#q14-ar)"/>
<text x="180" y="176" font-size="11" text-anchor="middle" fill="#7b8494">the two products separate with equal and opposite momenta</text>
</svg>
</figure>
