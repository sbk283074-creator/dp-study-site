<line x1="185" y1="100" x2="185" y2="54" stroke="#2f5fd0" stroke-width="2.3" marker-end="url(#q16-ar)"/>
<line x1="185" y1="54" x2="185" y2="276" stroke="#2f5fd0" stroke-width="2.3" marker-end="url(#q16-ar)"/>
