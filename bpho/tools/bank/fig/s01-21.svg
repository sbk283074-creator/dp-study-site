<figure class="fig">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 196" role="img" aria-label="A step-index optical fibre. A ray enters the flat end face from air at an angle theta-a to the fibre axis, is refracted into the core of refractive index 1.5, and then strikes the boundary with the cladding of refractive index 1.2 at more than the critical angle, so it is totally internally reflected at each wall and guided along the fibre.">
<defs><marker id="q21-ar" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#14181f"/></marker></defs>
