<line x1="60" y1="118" x2="360" y2="118" stroke="#14181f" stroke-width="1.6"/>
<text x="210" y="26" font-size="11" text-anchor="middle" fill="#7b8494">cladding  n₂ = 1.2</text>
<text x="210" y="156" font-size="11" text-anchor="middle" fill="#7b8494">cladding  n₂ = 1.2</text>
<text x="66" y="110" font-size="11" fill="#7b8494">core  n₁ = 1.5</text>
<line x1="30" y1="30" x2="60" y2="96" stroke="#b3352f" stroke-width="2.2" marker-end="url(#q21-ar)"/>
