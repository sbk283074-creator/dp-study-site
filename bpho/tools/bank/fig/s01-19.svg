<figure class="fig">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" role="img" aria-label="A stress-strain curve for a metal. The straight-line region runs from the origin to a point marked at a stress of 3.0 times 10 to the 8 pascals and a strain of 1.5 times 10 to the minus 3. The area of the triangle beneath that line is the strain energy per unit volume.">
<defs><marker id="q19-ar" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#14181f"/></marker></defs>
<line x1="70" y1="210" x2="322" y2="210" stroke="#14181f" stroke-width="1.7" marker-end="url(#q19-ar)"/>
<line x1="70" y1="210" x2="70" y2="28" stroke="#14181f" stroke-width="1.7" marker-end="url(#q19-ar)"/>
<text x="324" y="228" font-size="11.5" text-anchor="end" fill="#14181f">strain</text>
<text x="58" y="36" font-size="11.5" text-anchor="end" fill="#14181f">stress</text>
<line x1="70" y1="210" x2="210" y2="92" stroke="#2f5fd0" stroke-width="2.4"/>
<path d="M210,92 Q250,74 320,66" fill="none" stroke="#2f5fd0" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="210" cy="92" r="4" fill="#b3352f" stroke="#b3352f" stroke-width="2"/>
<text x="206" y="84" font-size="11" text-anchor="end" fill="#b3352f">end of the straight region</text>
<polygon points="70,210 210,92 210,210" fill="#dfe8f6" stroke="#2f5fd0" stroke-width="1.2" stroke-linejoin="round"/>
<line x1="212" y1="194" x2="224" y2="180" stroke="#2f5fd0" stroke-width="1.1"/>
<text x="228" y="168" font-size="11" fill="#2f5fd0">this shaded area is the</text>
<text x="228" y="182" font-size="11" fill="#2f5fd0">energy per unit volume</text>
<text x="150" y="234" font-size="11" text-anchor="middle" fill="#7b8494">the gradient is Young’s modulus</text>
</svg>
</figure>
