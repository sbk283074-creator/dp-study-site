<figure class="fig">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 284" role="img" aria-label="Two loudspeakers S1 and S2 and a point P, with the path from S1 to P marked 2.5 m and the path from S2 to P marked 3.5 m">
<line x1="140" y1="214" x2="255" y2="72" stroke="#7b8494" stroke-width="1.6" stroke-dasharray="7 5"/>
<line x1="330" y1="214" x2="255" y2="72" stroke="#7b8494" stroke-width="1.6" stroke-dasharray="7 5"/>
<circle cx="140" cy="214" r="6.5" fill="#ffffff" stroke="#14181f" stroke-width="1.8"/>
<circle cx="330" cy="214" r="6.5" fill="#ffffff" stroke="#14181f" stroke-width="1.8"/>
<circle cx="255" cy="72" r="6.5" fill="#ffffff" stroke="#2f5fd0" stroke-width="1.8"/>
<text x="140" y="238" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#14181f">S1</text>
<text x="330" y="238" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#14181f">S2</text>
<text x="255" y="58" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#2f5fd0">P</text>
<text x="133" y="160" font-size="11.5" fill="#14181f">2.5 m</text>
<text x="300" y="130" font-size="11.5" fill="#14181f">3.5 m</text>
<text x="28" y="268" font-size="11" fill="#7b8494">S1 and S2 are driven by the same oscillator, so they emit in phase.</text>
</svg>
</figure>
