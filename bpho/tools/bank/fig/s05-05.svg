<figure class="fig">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 208" role="img" aria-label="A velocity-time graph. The velocity rises in a straight line from zero to 20 metres per second over the first 5 seconds, stays at 20 metres per second until 15 seconds, then falls in a straight line back to zero at 19 seconds.">
<line x1="56" y1="44" x2="56" y2="158" stroke="#14181f" stroke-width="1.8"/>
<line x1="56" y1="158" x2="244" y2="158" stroke="#14181f" stroke-width="1.8"/>
<text x="8" y="16" font-size="11.5" fill="#14181f">velocity</text>
<text x="8" y="28" font-size="10.5" fill="#7b8494">/ m s</text>
<text x="148" y="192" font-size="11.5" text-anchor="middle" fill="#14181f">time / s</text>
<line x1="56" y1="44" x2="244" y2="44" stroke="#7b8494" stroke-width="0.9" stroke-dasharray="4 4"/>
<text x="50" y="48" font-size="11" text-anchor="end" fill="#14181f">20</text>
<text x="50" y="162" font-size="11" text-anchor="end" fill="#14181f">0</text>
<line x1="98.7273" y1="158" x2="98.7273" y2="163" stroke="#14181f" stroke-width="1.4"/>
<text x="98.7273" y="176" font-size="11" text-anchor="middle" fill="#14181f">5</text>
<line x1="184.182" y1="158" x2="184.182" y2="163" stroke="#14181f" stroke-width="1.4"/>
<text x="184.182" y="176" font-size="11" text-anchor="middle" fill="#14181f">15</text>
<line x1="218.364" y1="158" x2="218.364" y2="163" stroke="#14181f" stroke-width="1.4"/>
<text x="218.364" y="176" font-size="11" text-anchor="middle" fill="#14181f">19</text>
<polyline points="56,158 98.7273,44 184.182,44 218.364,158" fill="none" stroke="#2f5fd0" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="77.3636" y="34" font-size="10.5" text-anchor="middle" fill="#7b8494">accelerating</text>
<text x="141.455" y="34" font-size="10.5" text-anchor="middle" fill="#7b8494">steady</text>
<text x="201.273" y="34" font-size="10.5" text-anchor="middle" fill="#7b8494">braking</text>
</svg>
</figure>
