<figure class="fig">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 312" role="img" aria-label="A car at the top of a vertical circular loop of radius r, drawn with its weight and the normal reaction from the track both pointing downward and its velocity tangential">
<defs><marker id="s04-08-ar" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#b3352f"/></marker></defs>
<defs><marker id="s04-08-ab" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#2f5fd0"/></marker></defs>
<defs><marker id="s04-08-ag" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#1f7a53"/></marker></defs>
<circle cx="280" cy="172" r="100" fill="#f2f5fa" stroke="#14181f" stroke-width="3"/>
<circle cx="280" cy="172" r="88" fill="none" stroke="#c9d2e0" stroke-width="1.2"/>
<circle cx="280" cy="172" r="3" fill="#7b8494" stroke="#7b8494" stroke-width="1.2"/>
<line x1="280" y1="172" x2="280" y2="72" stroke="#7b8494" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="288" y="150" font-size="12" font-weight="bold" fill="#7b8494">r</text>
<rect x="260" y="74" width="40" height="15" fill="#e6eaf2" stroke="#14181f" stroke-width="1.6"/>
<line x1="269" y1="92" x2="269" y2="136" stroke="#b3352f" stroke-width="2.2" marker-end="url(#s04-08-ar)"/>
<text x="260" y="124" font-size="12" text-anchor="end" font-weight="bold" fill="#b3352f">mg</text>
<line x1="291" y1="92" x2="291" y2="120" stroke="#2f5fd0" stroke-width="2.2" marker-end="url(#s04-08-ab)"/>
<text x="301" y="112" font-size="12" font-weight="bold" fill="#2f5fd0">N</text>
<line x1="302" y1="56" x2="370" y2="56" stroke="#1f7a53" stroke-width="2.2" marker-end="url(#s04-08-ag)"/>
<text x="376" y="60" font-size="12.5" font-weight="bold" fill="#1f7a53">v</text>
<text x="280" y="34" font-size="11.5" text-anchor="middle" fill="#14181f">at the top, mg and N both act downward</text>
<text x="280" y="296" font-size="11.5" text-anchor="middle" fill="#7b8494">so mg + N = mv&#178;/r, and the smallest possible N is zero</text>
</svg>
</figure>
