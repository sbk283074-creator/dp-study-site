<figure class="fig">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 276" role="img" aria-label="A diffraction grating ruled with 500 lines per millimetre, illuminated at normal incidence by light of wavelength 600 nanometres. The undeviated zero order is shown, together with the first, second and third orders on one side. There is no fourth order, because it would require the sine of the diffraction angle to exceed one.">
<defs><marker id="q20-ar" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#14181f"/></marker></defs>
<line x1="50" y1="150" x2="380" y2="150" stroke="#14181f" stroke-width="2.4"/>
<line x1="60" y1="144" x2="60" y2="156" stroke="#ffffff" stroke-width="3"/>
<line x1="84" y1="144" x2="84" y2="156" stroke="#ffffff" stroke-width="3"/>
<line x1="108" y1="144" x2="108" y2="156" stroke="#ffffff" stroke-width="3"/>
<line x1="132" y1="144" x2="132" y2="156" stroke="#ffffff" stroke-width="3"/>
<line x1="156" y1="144" x2="156" y2="156" stroke="#ffffff" stroke-width="3"/>
<line x1="180" y1="144" x2="180" y2="156" stroke="#ffffff" stroke-width="3"/>
<line x1="204" y1="144" x2="204" y2="156" stroke="#ffffff" stroke-width="3"/>
<line x1="228" y1="144" x2="228" y2="156" stroke="#ffffff" stroke-width="3"/>
<line x1="252" y1="144" x2="252" y2="156" stroke="#ffffff" stroke-width="3"/>
<line x1="276" y1="144" x2="276" y2="156" stroke="#ffffff" stroke-width="3"/>
<line x1="300" y1="144" x2="300" y2="156" stroke="#ffffff" stroke-width="3"/>
<line x1="324" y1="144" x2="324" y2="156" stroke="#ffffff" stroke-width="3"/>
<line x1="348" y1="144" x2="348" y2="156" stroke="#ffffff" stroke-width="3"/>
<line x1="372" y1="144" x2="372" y2="156" stroke="#ffffff" stroke-width="3"/>
<text x="205" y="138" font-size="11" text-anchor="end" fill="#7b8494">grating: 500 lines/mm</text>
<line x1="215" y1="20" x2="215" y2="142" stroke="#b3352f" stroke-width="2.4" marker-end="url(#q20-ar)"/>
<text x="215" y="12" font-size="11" text-anchor="middle" fill="#b3352f">600 nm, normal incidence</text>
<line x1="215" y1="158" x2="215" y2="220" stroke="#7b8494" stroke-width="1.6"/>
<text x="215" y="234" font-size="11" text-anchor="middle" fill="#7b8494">n = 0</text>
<line x1="215" y1="158" x2="293" y2="216" stroke="#2f5fd0" stroke-width="1.8" marker-end="url(#q20-ar)"/>
<text x="299" y="228" font-size="11" fill="#2f5fd0">n = 1</text>
<line x1="215" y1="158" x2="327" y2="200" stroke="#2f5fd0" stroke-width="1.8" marker-end="url(#q20-ar)"/>
<text x="333" y="212" font-size="11" fill="#2f5fd0">n = 2</text>
<line x1="215" y1="158" x2="361" y2="186" stroke="#2f5fd0" stroke-width="1.8" marker-end="url(#q20-ar)"/>
<text x="367" y="198" font-size="11" fill="#2f5fd0">n = 3</text>
<text x="50" y="250" font-size="11" fill="#7b8494">no order beyond n = 3:</text>
<text x="50" y="264" font-size="11" fill="#7b8494">it would need sin θ above 1</text>
</svg>
</figure>
