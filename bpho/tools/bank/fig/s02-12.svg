<line x1="468" y1="64" x2="468" y2="186" stroke="#14181f" stroke-width="1.8"/>
<line x1="54" y1="112" x2="94" y2="112" stroke="#14181f" stroke-width="2.4"/>
<line x1="64" y1="134" x2="84" y2="134" stroke="#14181f" stroke-width="2.4"/>
