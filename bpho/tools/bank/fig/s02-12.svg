<figure class="fig">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 250" role="img" aria-label="A circuit: a 12 V source with 2 ohm internal resistance driving two 6 ohm resistors in parallel, in series with a 3 ohm resistor">
<defs><marker id="s02-12-ar" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#14181f"/></marker></defs>
