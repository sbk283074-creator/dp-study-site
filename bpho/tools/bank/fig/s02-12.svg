<text x="419" y="50" font-size="11" text-anchor="middle" fill="#14181f">3 &Omega;</text>
<text x="78" y="216" font-size="11.5" fill="#7b8494">The source has an internal resistance of 2 &Omega;.</text>
<text x="78" y="232" font-size="11.5" fill="#7b8494">The two 6 &Omega; resistors are in parallel with each other.</text>
</svg>
