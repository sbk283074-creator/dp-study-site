<text x="46" y="172" font-size="10.5" fill="#7b8494">the source</text>
<line x1="240" y1="64" x2="240" y2="97" stroke="#14181f" stroke-width="1.8"/>
<line x1="240" y1="153" x2="240" y2="186" stroke="#14181f" stroke-width="1.8"/>
<rect x="232" y="97" width="16" height="56" fill="#ffffff" stroke="#14181f" stroke-width="1.6"/>
<text x="254" y="128" font-size="11" fill="#14181f">6 &Omega;</text>
<line x1="320" y1="64" x2="320" y2="97" stroke="#14181f" stroke-width="1.8"/>
