<text x="109" y="44" font-size="10.5" text-anchor="middle" fill="#14181f">3.0</text>
<line x1="126" y1="62" x2="244" y2="62" stroke="#14181f" stroke-width="1.8"/>
<line x1="244" y1="62" x2="244" y2="92" stroke="#14181f" stroke-width="1.8"/>
<line x1="234" y1="100" x2="254" y2="100" stroke="#14181f" stroke-width="2.6"/>
<line x1="240" y1="108" x2="248" y2="108" stroke="#14181f" stroke-width="2.6"/>
<line x1="244" y1="108" x2="244" y2="130" stroke="#14181f" stroke-width="1.8"/>
<text x="258" y="104" font-size="10.5" fill="#14181f">12 V, 1.0</text>
<text x="258" y="118" font-size="10" fill="#7b8494">internal</text>
<line x1="244" y1="178" x2="36" y2="178" stroke="#14181f" stroke-width="1.8"/>
<line x1="36" y1="178" x2="36" y2="152" stroke="#14181f" stroke-width="1.8"/>
<line x1="44" y1="144" x2="28" y2="144" stroke="#14181f" stroke-width="2.6"/>
