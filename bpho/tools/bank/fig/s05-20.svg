<figure class="fig">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 322 200" role="img" aria-label="A single loop containing a 3.0 ohm resistor, a 12 volt cell of internal resistance 1.0 ohm with its positive terminal uppermost, and a 6.0 volt cell of internal resistance 2.0 ohms with its positive terminal lowermost, so the two cells oppose each other.">
<rect x="36" y="62" width="208" height="116" fill="none" stroke="#14181f" stroke-width="1.8"/>
