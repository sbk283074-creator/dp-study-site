<line x1="36" y1="136" x2="36" y2="62" stroke="#14181f" stroke-width="1.8"/>
<text x="50" y="140" font-size="10.5" fill="#14181f">6.0 V, 2.0</text>
<text x="50" y="154" font-size="10" fill="#7b8494">internal</text>
<text x="140" y="110" font-size="11" text-anchor="middle" fill="#b3352f">the cells face</text>
