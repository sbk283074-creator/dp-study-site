<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" role="img" aria-label="Neon Dungeon gameplay screen: dungeon room with player, two enemies, loot and stairs, plus health HUD, minimap, message log and item bar">
  <defs>
    <pattern id="neonPlay-tile" width="30" height="30" patternUnits="userSpaceOnUse" x="170" y="170">
      <rect width="30" height="30" fill="#171b24"/>
      <path d="M30 0 L30 30 L0 30" fill="none" stroke="#232833" stroke-width="1"/>
    </pattern>
    <radialGradient id="neonPlay-torch" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb347" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#ffb347" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neonPlay-vig" cx="50%" cy="48%" r="62%">
      <stop offset="55%" stop-color="#0b0d12" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0b0d12" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="neonPlay-glowL" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="neonPlay-glowM" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4.5"/>
    </filter>
    <filter id="neonPlay-glowS" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <clipPath id="neonPlay-room">
      <rect x="140" y="140" width="600" height="300" rx="4"/>
    </clipPath>
  </defs>

  <rect width="880" height="520" fill="#0f1115" rx="10"/>

  <g font-family="ui-monospace, Menlo, Consolas, monospace">
    <rect x="12" y="12" width="856" height="496" rx="8" fill="none" stroke="#232833" stroke-width="1.5"/>

    <!-- ============ top-left HUD ============ -->
    <rect x="22" y="16" width="250" height="78" rx="8" fill="#12151d" fill-opacity="0.85" stroke="#232833" stroke-width="1"/>
    <path d="M0 7 C -6 1 -11 -4 -7 -9 C -4 -13 0 -10 0 -6 C 0 -10 4 -13 7 -9 C 11 -4 6 1 0 7 Z" transform="translate(40,32) scale(0.85)" fill="#ff4d5e"/>
    <path d="M0 7 C -6 1 -11 -4 -7 -9 C -4 -13 0 -10 0 -6 C 0 -10 4 -13 7 -9 C 11 -4 6 1 0 7 Z" transform="translate(66,32) scale(0.85)" fill="#ff4d5e"/>
    <path d="M0 7 C -6 1 -11 -4 -7 -9 C -4 -13 0 -10 0 -6 C 0 -10 4 -13 7 -9 C 11 -4 6 1 0 7 Z" transform="translate(92,32) scale(0.85)" fill="#ff4d5e"/>
    <path d="M0 7 C -6 1 -11 -4 -7 -9 C -4 -13 0 -10 0 -6 C 0 -10 4 -13 7 -9 C 11 -4 6 1 0 7 Z" transform="translate(118,32) scale(0.85)" fill="#171b24" stroke="#3d465a" stroke-width="1.5"/>
    <path d="M0 7 C -6 1 -11 -4 -7 -9 C -4 -13 0 -10 0 -6 C 0 -10 4 -13 7 -9 C 11 -4 6 1 0 7 Z" transform="translate(144,32) scale(0.85)" fill="#171b24" stroke="#3d465a" stroke-width="1.5"/>

    <rect x="30" y="50" width="170" height="12" rx="6" fill="#171b24" stroke="#3d465a" stroke-width="1"/>
    <rect x="32" y="52" width="116" height="8" rx="4" fill="#ff4d5e"/>
    <rect x="30" y="70" width="170" height="10" rx="5" fill="#171b24" stroke="#3d465a" stroke-width="1"/>
    <rect x="32" y="72" width="74" height="6" rx="3" fill="#b6ff5c"/>
    <rect x="208" y="66" width="52" height="20" rx="5" fill="#171b24" stroke="#b6ff5c" stroke-width="1"/>
    <text x="234" y="80" text-anchor="middle" font-size="12" fill="#b6ff5c">LV 4</text>

    <!-- ============ top-centre floor name ============ -->
    <text x="440" y="42" text-anchor="middle" font-size="22" font-weight="bold" fill="#34e0d8" letter-spacing="2">FLOOR 3</text>
    <text x="440" y="64" text-anchor="middle" font-size="13" fill="#7c8699">The Cistern</text>

    <!-- ============ top-right minimap ============ -->
    <rect x="716" y="20" width="140" height="110" rx="6" fill="#0b0d12" stroke="#3d465a" stroke-width="1"/>
    <text x="724" y="28" font-size="11" fill="#7c8699">MAP</text>
    <line x1="720" y1="32" x2="852" y2="32" stroke="#232833" stroke-width="1"/>
    <rect x="726" y="34" width="46" height="34" fill="#34e0d8" fill-opacity="0.18" stroke="#7c8699" stroke-opacity="0.55" stroke-width="1"/>
    <rect x="726" y="80" width="46" height="44" fill="#34e0d8" fill-opacity="0.18" stroke="#7c8699" stroke-opacity="0.55" stroke-width="1"/>
    <rect x="796" y="38" width="52" height="44" fill="#34e0d8" fill-opacity="0.18" stroke="#7c8699" stroke-opacity="0.55" stroke-width="1"/>
    <rect x="790" y="96" width="58" height="28" fill="#2b3242" stroke="#3d465a" stroke-width="1"/>
    <rect x="772" y="48" width="24" height="8" fill="#34e0d8" fill-opacity="0.16"/>
    <rect x="744" y="68" width="8" height="12" fill="#34e0d8" fill-opacity="0.16"/>
    <rect x="772" y="104" width="18" height="8" fill="#34e0d8" fill-opacity="0.16"/>
    <circle cx="749" cy="51" r="3.5" fill="#ff4fd8"/>
    <circle cx="822" cy="60" r="3" fill="#ff4d5e"/>
    <circle cx="819" cy="110" r="3.5" fill="#ffb347"/>

    <!-- ============ main viewport ============ -->
    <rect x="140" y="140" width="600" height="300" rx="4" fill="#0b0d12"/>
    <g clip-path="url(#neonPlay-room)">
      <rect x="170" y="170" width="540" height="240" fill="url(#neonPlay-tile)"/>
      <rect x="520" y="170" width="190" height="56" fill="#0b0d12" opacity="0.30"/>
      <rect x="180" y="352" width="130" height="58" fill="#0b0d12" opacity="0.30"/>
      <rect x="140" y="140" width="600" height="300" fill="url(#neonPlay-vig)"/>
      <circle cx="178" cy="275" r="122" fill="url(#neonPlay-torch)"/>
    </g>

    <!-- walls -->
    <rect x="140" y="140" width="600" height="30" fill="#2b3242"/>
    <rect x="140" y="140" width="600" height="5" fill="#3d465a"/>
    <rect x="140" y="170" width="30" height="240" fill="#2b3242"/>
    <rect x="167" y="170" width="3" height="240" fill="#3d465a" opacity="0.7"/>
    <rect x="710" y="170" width="30" height="240" fill="#2b3242"/>
    <rect x="710" y="170" width="3" height="240" fill="#3d465a" opacity="0.7"/>
    <rect x="140" y="410" width="600" height="30" fill="#2b3242"/>
    <rect x="140" y="410" width="600" height="4" fill="#3d465a" opacity="0.6"/>

    <!-- torch -->
    <rect x="165" y="277" width="9" height="11" fill="#3d465a"/>
    <circle cx="172" cy="275" r="4" fill="#ffb347"/>
    <circle cx="172" cy="275" r="7" fill="#ffb347" opacity="0.35" filter="url(#neonPlay-glowS)"/>

    <!-- stairs -->
    <rect x="624" y="174" width="42" height="26" rx="3" fill="#ffb347" fill-opacity="0.85"/>
    <rect x="631" y="180" width="28" height="14" rx="2" fill="#ffe2b0" fill-opacity="0.85"/>

    <!-- scrap pickup -->
    <circle cx="245" cy="305" r="12" fill="#b6ff5c" opacity="0.30" filter="url(#neonPlay-glowS)"/>
    <polygon points="245,293 257,305 245,317 233,305" fill="#b6ff5c"/>

    <!-- stalker (magenta diamond) -->
    <polygon points="485,225 505,245 485,265 465,245" fill="#ff4fd8" opacity="0.45" filter="url(#neonPlay-glowM)"/>
    <polygon points="485,228 502,245 485,262 468,245" fill="#ff4fd8"/>

    <!-- brute (red square) -->
    <rect x="589" y="319" width="32" height="32" rx="4" fill="#ff4d5e" opacity="0.45" filter="url(#neonPlay-glowM)"/>
    <rect x="591" y="321" width="28" height="28" rx="4" fill="#ff4d5e"/>

    <!-- player (cyan rounded square with notch) -->
    <rect x="320" y="320" width="30" height="30" rx="7" fill="#34e0d8" opacity="0.45" filter="url(#neonPlay-glowL)"/>
    <polygon points="335,311 341,320 329,320" fill="#34e0d8" opacity="0.45" filter="url(#neonPlay-glowS)"/>
    <rect x="320" y="320" width="30" height="30" rx="7" fill="#34e0d8"/>
    <polygon points="335,310 341,320 329,320" fill="#34e0d8"/>
    <rect x="326" y="336" width="18" height="4" rx="2" fill="#0b0d12" opacity="0.55"/>

    <!-- floating damage number -->
    <text x="512" y="222" font-size="20" font-weight="bold" fill="#ffb347" opacity="0.6" filter="url(#neonPlay-glowS)">7</text>
    <text x="512" y="222" font-size="20" font-weight="bold" fill="#ffb347">7</text>

    <!-- ============ message log ============ -->
    <text x="30" y="464" font-size="13" fill="#7c8699">&gt; You hit the stalker for 7.</text>
    <text x="30" y="482" font-size="13" fill="#7c8699">&gt; The brute misses.</text>
    <text x="30" y="500" font-size="13" fill="#7c8699">&gt; You picked up 12 scrap.</text>

    <!-- ============ item bar ============ -->
    <rect x="586" y="460" width="86" height="32" rx="6" fill="#2b3242" stroke="#ffb347" stroke-width="1.5"/>
    <text x="594" y="481" font-size="12" fill="#ffb347">1 Dash</text>
    <text x="666" y="489" text-anchor="end" font-size="11" fill="#7c8699">x3</text>
    <rect x="680" y="460" width="86" height="32" rx="6" fill="#171b24" stroke="#3d465a" stroke-width="1"/>
    <text x="688" y="481" font-size="12" fill="#e8ecf4">2 Bomb</text>
    <text x="760" y="489" text-anchor="end" font-size="11" fill="#7c8699">x2</text>
    <rect x="774" y="460" width="86" height="32" rx="6" fill="#171b24" stroke="#3d465a" stroke-width="1"/>
    <text x="782" y="481" font-size="12" fill="#e8ecf4">3 Potion</text>
    <text x="854" y="489" text-anchor="end" font-size="11" fill="#7c8699">x1</text>
  </g>
</svg>
